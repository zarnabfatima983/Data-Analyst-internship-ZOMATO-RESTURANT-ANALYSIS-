[server]
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
# Default theme — users can switch inside the app via the theme selector
base = "dark"
primaryColor = "#6c63ff"
backgroundColor = "#0f1117"
secondaryBackgroundColor = "#1a1d29"
textColor = "#e8eaf6"
font = "sans serif"
